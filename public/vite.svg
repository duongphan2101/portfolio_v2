<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base with subtle glass stroke -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="10"/>

  <!-- Bold Minimalist Geometric "D" Monogram -->
  <path d="M 168 136 H 258 C 342 136, 396 186, 396 256 C 396 326, 342 376, 258 376 H 168 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="46" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Live Status Emerald Dot inside D -->
  <circle cx="252" cy="256" r="32" fill="url(#dotGrad)"/>
</svg>